<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar Call</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <section class="videos">
        <div class="tile">
          <canvas id="avatar" width="640" height="480"></canvas>
          <div class="caption" id="capAvatar"></div>
          <span class="label">Avatar</span>
        </div>
        <div class="tile">
          <video id="cam" width="640" height="480" autoplay muted playsinline></video>
          <div class="caption" id="capUser"></div>
          <span class="label">You</span>
        </div>
      </section>

      <section class="controls">
        <textarea id="systemPrompt" rows="3" spellcheck="false">You are a friendly job interviewer. Ask one question at a time and react to my answers.</textarea>
        <div class="buttons">
          <button id="startBtn">Start call</button>
          <button id="stopBtn" disabled>End call</button>
          <label class="toggle"><input type="checkbox" id="captionsToggle" checked /> Captions</label>
          <span id="status">Idle</span>
        </div>
      </section>

      <section id="log" class="log" aria-live="polite"></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
