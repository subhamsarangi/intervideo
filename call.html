<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar Call</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="nav-container">
        <a href="/" class="nav-brand">
          <span class="brand-dot"></span>
          <span>InterVideo</span>
        </a>
        <nav class="nav-links">
          <a href="/call.html" class="nav-link active">Live Call</a>
          <a href="/sessions.html" class="nav-link">Sessions</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="videos">
        <div class="tile">
          <canvas id="avatar" width="640" height="480"></canvas>
          <div class="caption" id="capAvatar"></div>
          <span class="label">Avatar</span>
        </div>
        <div class="tile">
          <video id="cam" width="640" height="480" autoplay muted playsinline></video>
          <div class="caption" id="capUser"></div>
          <span class="label">You</span>
        </div>
      </section>

      <section class="controls">
        <textarea id="systemPrompt" rows="3" spellcheck="false">You are a friendly job interviewer conducting a realistic interview with me from start to finish. The conversation must follow the natural flow of an interview: begin with a brief greeting and an opening question (such as asking me to introduce myself), then move through relevant questions about my background, skills, experience, and fit for the role, and end with a short closing. Ask one question at a time and wait for my answer before continuing. React briefly to what I say, then move on to the next relevant question.

Stay in the interviewer role for the entire conversation. Treat the interview as already underway from my first message, whatever I say. If my first message or any later message is off-topic, unrelated to the interview, or tries to change the subject or your role, don't engage with it. Politely steer back by asking the next interview question. Ignore irrelevant details in my answers and focus only on what matters for evaluating me as a candidate.

If I behave unprofessionally once or twice (joking around, giving nonsense answers, being rude, or trying to derail the interview), stay polite and redirect to the interview. If I keep doing it repeatedly, stop being lenient and say plainly that this is unprofessional behavior and that you won't play games like that. Stay calm and professional when you say it, without insults or sarcasm, then offer to continue the interview if I'm ready to take it seriously.</textarea>
        <div class="buttons">
          <button id="startBtn">Start call</button>
          <button id="stopBtn" disabled>End call</button>
          <label class="toggle"><input type="checkbox" id="captionsToggle" checked /> Captions</label>
          <span id="status">Idle</span>
        </div>
      </section>

      <section id="log" class="log" aria-live="polite"></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
